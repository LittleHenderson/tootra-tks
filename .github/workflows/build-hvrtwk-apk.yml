name: Build HvrTwk APK

on:
  push:
    paths:
      - 'hvrtwk-android/**'
      - 'hvrtwk.js'
      - '.github/workflows/build-hvrtwk-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy latest hvrtwk.js into assets
        run: cp hvrtwk.js hvrtwk-android/app/src/main/assets/hvrtwk.js

      - name: Generate Gradle wrapper
        working-directory: hvrtwk-android
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build debug APK
        working-directory: hvrtwk-android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HvrTwk-debug
          path: hvrtwk-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
