<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <style>
                    .wire { stroke: #00ff87; stroke-width: 3; fill: none; }
                    .transistor { stroke: #ffffff; stroke-width: 2.5; fill: none; }
                    .arrow { fill: #ffffff; stroke: #ffffff; stroke-width: 2; }
                    .label { fill: #00ffff; font: 700 14px ui-monospace,Consolas,monospace; }
                    .pin-label { fill: #e8f0ff; font: 12px ui-monospace,Consolas,monospace; }
                    .param { fill: #9bb0d6; font: 11px ui-monospace,Consolas,monospace; }
                    .badge { fill: #0a0e1e; stroke: #7bb6ff; stroke-width: 2; }
                    .badgeText { fill: #cfe6ff; font: 12px ui-monospace,Consolas,monospace; text-anchor: middle; dominant-baseline: middle; }
                    .grid { stroke: #19203b; stroke-width: 0.5; fill: none; }
                    .title { fill: #00ffff; font: 700 16px ui-monospace,Consolas,monospace; }
                    .desc { fill: #9bb0d6; font: 12px ui-monospace,Consolas,monospace; }
                    .formula-text { fill: #ffe14a; font: 11px ui-monospace,Consolas,monospace; }
                </style>
                <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                    <path d="M 20 0 L 0 0 0 20" class="grid"/>
                </pattern>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
            
            <rect width="1600" height="900" fill="url(#grid)"/>
            
            <!-- Title Section -->
            <text x="800" y="40" class="title" text-anchor="middle">NJT Symbol Reference &amp; Integration Guide</text>
            
            <!-- NJT+ Symbol (Left) -->
            <g transform="translate(200, 100)">
                <text x="100" y="-10" class="label" text-anchor="middle">NJT⁺ (Promote/Excitatory)</text>
                
                <!-- Transistor circle -->
                <circle cx="100" cy="80" r="40" class="transistor"/>
                
                <!-- Pins -->
                <!-- C (Cause) - left -->
                <line x1="30" y1="80" x2="60" y2="80" class="wire"/>
                <text x="20" y="85" class="pin-label" text-anchor="end">C</text>
                <text x="20" y="100" class="desc" text-anchor="end">(Cause)</text>
                
                <!-- B (Bias) - bottom -->
                <line x1="100" y1="120" x2="100" y2="160" class="wire"/>
                <text x="100" y="175" class="pin-label" text-anchor="middle">B</text>
                <text x="100" y="190" class="desc" text-anchor="middle">(Bias)</text>
                
                <!-- E (Effect) - right -->
                <line x1="140" y1="80" x2="170" y2="80" class="wire"/>
                <text x="180" y="85" class="pin-label">E</text>
                <text x="180" y="100" class="desc">(Effect)</text>
                
                <!-- Internal symbol -->
                <text x="100" y="90" class="pin-label" text-anchor="middle" font-size="20">+</text>
                
                <!-- Arrow pointing toward E (promote) - raised above symbol -->
                <path d="M 85 70 L 115 70" class="arrow" stroke-width="3"/>
                <polygon points="115,70 110,65 110,75" class="arrow"/>
                
                <!-- Parameters -->
                <text x="100" y="215" class="param" text-anchor="middle">β=2.0  τ_B=0.5  k=10</text>
                <text x="100" y="230" class="param" text-anchor="middle">clamp[0,1]</text>
                
                <!-- Badge on bias wire -->
                <g transform="translate(100, 140)">
                    <rect x="-22" y="-10" width="44" height="20" rx="5" class="badge"/>
                    <text x="0" y="0" class="badgeText">+N2</text>
                </g>
            </g>
            
            <!-- NJT- Symbol (Right) -->
            <g transform="translate(500, 100)">
                <text x="100" y="-10" class="label" text-anchor="middle">NJT⁻ (Inhibit/Braking)</text>
                
                <!-- Transistor circle -->
                <circle cx="100" cy="80" r="40" class="transistor"/>
                
                <!-- Pins -->
                <!-- C (Cause) - left -->
                <line x1="30" y1="80" x2="60" y2="80" class="wire"/>
                <text x="20" y="85" class="pin-label" text-anchor="end">C</text>
                <text x="20" y="100" class="desc" text-anchor="end">(Cause)</text>
                
                <!-- B (Bias) - bottom -->
                <line x1="100" y1="120" x2="100" y2="160" class="wire"/>
                <text x="100" y="175" class="pin-label" text-anchor="middle">B</text>
                <text x="100" y="190" class="desc" text-anchor="middle">(Bias)</text>
                
                <!-- E (Effect) - right -->
                <line x1="140" y1="80" x2="170" y2="80" class="wire"/>
                <text x="180" y="85" class="pin-label">E</text>
                <text x="180" y="100" class="desc">(Effect)</text>
                
                <!-- Internal symbol -->
                <text x="100" y="90" class="pin-label" text-anchor="middle" font-size="20">−</text>
                
                <!-- Arrow pointing toward C (inhibit) - raised above symbol -->
                <path d="M 115 70 L 85 70" class="arrow" stroke-width="3"/>
                <polygon points="85,70 90,65 90,75" class="arrow"/>
                
                <!-- Parameters -->
                <text x="100" y="215" class="param" text-anchor="middle">β=1.5  τ_B=0.3  k=15</text>
                <text x="100" y="230" class="param" text-anchor="middle">clamp[0,1]</text>
                
                <!-- Badge on bias wire -->
                <g transform="translate(100, 140)">
                    <rect x="-22" y="-10" width="44" height="20" rx="5" class="badge"/>
                    <text x="0" y="0" class="badgeText">−N3</text>
                </g>
            </g>
            
            <!-- Example Circuit: Desire Amplifier -->
            <g transform="translate(850, 100)">
                <text x="150" y="-10" class="label" text-anchor="middle">Example: Desire Amplifier Circuit</text>
                
                <!-- Input: Foundation F3 -->
                <text x="0" y="85" class="pin-label">F3 (Life)</text>
                <line x1="50" y1="80" x2="110" y2="80" class="wire"/>
                
                <!-- NJT+ -->
                <circle cx="150" cy="80" r="40" class="transistor"/>
                <text x="150" y="90" class="pin-label" text-anchor="middle" font-size="20">+</text>
                <path d="M 135 70 L 165 70" class="arrow" stroke-width="3"/>
                <polygon points="165,70 160,65 160,75" class="arrow"/>
                
                <!-- Bias input with badges -->
                <line x1="150" y1="120" x2="150" y2="180" class="wire"/>
                <text x="150" y="195" class="desc" text-anchor="middle">Desire Signal</text>
                
                <!-- N7 rhythm badge -->
                <g transform="translate(150, 140)">
                    <rect x="-22" y="-10" width="44" height="20" rx="5" class="badge"/>
                    <text x="0" y="0" class="badgeText">N7</text>
                </g>
                
                <!-- ×N4 gain badge on body -->
                <g transform="translate(150, 50)">
                    <rect x="-22" y="-10" width="44" height="20" rx="5" class="badge"/>
                    <text x="0" y="0" class="badgeText">×N4</text>
                </g>
                
                <!-- Output to Acquisition -->
                <line x1="190" y1="80" x2="250" y2="80" class="wire"/>
                <text x="260" y="85" class="pin-label">A14</text>
                
                <!-- Parameters -->
                <text x="150" y="220" class="param" text-anchor="middle">β=7.0 (×N4)</text>
                <text x="150" y="235" class="param" text-anchor="middle">Updates per N7</text>
            </g>
            
            <!-- Example Circuit: Anxiety Dampener -->
            <g transform="translate(1150, 100)">
                <text x="150" y="-10" class="label" text-anchor="middle">Example: Anxiety Dampener</text>
                
                <!-- Input: Worry signal -->
                <text x="0" y="85" class="pin-label">Worry</text>
                <line x1="50" y1="80" x2="110" y2="80" class="wire"/>
                
                <!-- NJT- -->
                <circle cx="150" cy="80" r="40" class="transistor"/>
                <text x="150" y="90" class="pin-label" text-anchor="middle" font-size="20">−</text>
                <path d="M 165 70 L 135 70" class="arrow" stroke-width="3"/>
                <polygon points="135,70 140,65 140,75" class="arrow"/>
                
                <!-- Bias input -->
                <line x1="150" y1="120" x2="150" y2="180" class="wire"/>
                <text x="150" y="195" class="desc" text-anchor="middle">Calm Breathing</text>
                
                <!-- −N3 badge raises threshold -->
                <g transform="translate(150, 140)">
                    <rect x="-22" y="-10" width="44" height="20" rx="5" class="badge"/>
                    <text x="0" y="0" class="badgeText">−N3</text>
                </g>
                
                <!-- Output -->
                <line x1="190" y1="80" x2="250" y2="80" class="wire"/>
                <text x="260" y="85" class="pin-label">Output</text>
                
                <!-- Parameters -->
                <text x="150" y="220" class="param" text-anchor="middle">High τ_B via −N3</text>
                <text x="150" y="235" class="param" text-anchor="middle">↑Calm = ↓Worry</text>
            </g>
            
            <!-- Mathematical Formulas Section -->
            <g transform="translate(100, 350)">
                <rect x="0" y="0" width="700" height="200" fill="#0a0a1a" stroke="#2a3f5f" stroke-width="1" rx="5"/>
                <text x="350" y="30" class="title" text-anchor="middle">Mathematical Specification</text>
                
                <text x="20" y="60" class="formula-text">Gate function:  g(B) = σ(k(p̃_B - τ_B))</text>
                <text x="20" y="85" class="formula-text">where p̃_B = p_B + α₂·N2 - α₃·N3  (Noetic-modified base)</text>
                
                <text x="20" y="115" class="formula-text">NJT⁺ output:  p_E = clamp(β · p_C · g(B), 0, 1)</text>
                <text x="20" y="140" class="formula-text">NJT⁻ output:  p_E = clamp(β · p_C · (1 - g(B)), 0, 1)</text>
                
                <text x="20" y="170" class="formula-text">Gain: β = β_base × N4_gain × world_weight × practice_factor</text>
                <text x="20" y="195" class="formula-text">All signals p ∈ [0,1], discrete time t = 0,1,2,...</text>
            </g>
            
            <!-- Noetic Badge Reference -->
            <g transform="translate(850, 350)">
                <rect x="0" y="0" width="650" height="200" fill="#0a0a1a" stroke="#2a3f5f" stroke-width="1" rx="5"/>
                <text x="325" y="30" class="title" text-anchor="middle">Noetic Badge Functions</text>
                
                <g transform="translate(20, 50)">
                    <text class="desc">Base Wire Badges:</text>
                    <text y="25" class="formula-text">+N2 (Positive): Adds positive bias offset</text>
                    <text y="45" class="formula-text">−N3 (Negative): Adds negative bias/damping</text>
                    <text y="65" class="formula-text">N5 (Memory): Adds hysteresis/stickiness</text>
                    <text y="85" class="formula-text">N7 (Rhythm): Controls update schedule</text>
                    <text y="105" class="formula-text">N8→N9: Trigger→response pairing</text>
                </g>
                
                <g transform="translate(350, 50)">
                    <text class="desc">Body Badges:</text>
                    <text y="25" class="formula-text">×N4 (Vibration): Gain/amplitude scalar β</text>
                    <text y="45" class="formula-text">N6 (Deliver): Gates output forwarding</text>
                    
                    <text y="85" class="desc">World Weights:</text>
                    <text y="105" class="formula-text">A,B,C,D weights: Σw = 1</text>
                </g>
            </g>
            
            <!-- Feedback Loop Example -->
            <g transform="translate(100, 600)">
                <text x="350" y="0" class="label">Oscillator Circuit (Self-Reinforcing Desire)</text>
                
                <!-- NJT+ with feedback -->
                <circle cx="200" cy="80" r="40" class="transistor"/>
                <text x="200" y="90" class="pin-label" text-anchor="middle" font-size="18">+</text>
                <path d="M 185 70 L 215 70" class="arrow" stroke-width="3"/>
                <polygon points="215,70 210,65 210,75" class="arrow"/>
                
                <!-- Input -->
                <text x="80" y="85" class="pin-label">Initial</text>
                <line x1="120" y1="80" x2="160" y2="80" class="wire"/>
                
                <!-- Output -->
                <line x1="240" y1="80" x2="320" y2="80" class="wire"/>
                
                <!-- Delay block -->
                <rect x="320" y="60" width="60" height="40" class="transistor"/>
                <text x="350" y="85" class="pin-label" text-anchor="middle">Delay</text>
                
                <!-- NOT gate -->
                <g transform="translate(420, 65)">
                    <path d="M0,0 L0,30 L30,15 Z" class="transistor"/>
                    <circle cx="35" cy="15" r="5" class="transistor"/>
                </g>
                
                <!-- Feedback path -->
                <line x1="460" y1="80" x2="500" y2="80" class="wire"/>
                <path d="M 500 80 Q 550 80 550 180 Q 550 280 200 280 Q 100 280 100 180 Q 100 140 200 140 L 200 120" stroke="#ff48ff" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
                
                <!-- Feedback badges -->
                <g transform="translate(350, 250)">
                    <rect x="-22" y="-10" width="44" height="20" rx="5" class="badge" stroke="#ff48ff"/>
                    <text x="0" y="0" class="badgeText">N7</text>
                </g>
                
                <text x="200" y="180" class="param" text-anchor="middle">Creates rhythmic pulses</text>
                <text x="200" y="195" class="param" text-anchor="middle">Period set by delay + N7</text>
            </g>
            
            <!-- Memory Cell Example -->
            <g transform="translate(650, 600)">
                <text x="200" y="0" class="label">Bistable Memory (Cross-coupled NJTs)</text>
                
                <!-- First NJT+ -->
                <circle cx="150" cy="80" r="35" class="transistor"/>
                <text x="150" y="88" class="pin-label" text-anchor="middle" font-size="16">+</text>
                <path d="M 138 72 L 162 72" class="arrow" stroke-width="2"/>
                <polygon points="162,72 158,68 158,76" class="arrow"/>
                
                <!-- Second NJT+ -->
                <circle cx="250" cy="80" r="35" class="transistor"/>
                <text x="250" y="88" class="pin-label" text-anchor="middle" font-size="16">+</text>
                <path d="M 238 72 L 262 72" class="arrow" stroke-width="2"/>
                <polygon points="262,72 258,68 258,76" class="arrow"/>
                
                <!-- Cross-coupling -->
                <path d="M 185 80 Q 200 80 200 60 Q 200 40 250 40 L 250 45" class="wire"/>
                <path d="M 215 80 Q 200 80 200 100 Q 200 120 150 120 L 150 115" class="wire"/>
                
                <!-- N5 memory badges -->
                <g transform="translate(150, 135)">
                    <rect x="-20" y="-8" width="40" height="16" rx="4" class="badge"/>
                    <text x="0" y="0" class="badgeText" font-size="10">N5</text>
                </g>
                <g transform="translate(250, 135)">
                    <rect x="-20" y="-8" width="40" height="16" rx="4" class="badge"/>
                    <text x="0" y="0" class="badgeText" font-size="10">N5</text>
                </g>
                
                <!-- States -->
                <text x="150" y="170" class="param" text-anchor="middle">State A</text>
                <text x="250" y="170" class="param" text-anchor="middle">State B</text>
                <text x="200" y="190" class="desc" text-anchor="middle">Holds one state until flipped</text>
            </g>
            
            <!-- Integration with existing NCD -->
            <g transform="translate(1050, 600)">
                <text x="200" y="0" class="label">Integration with NCD Pipeline</text>
                
                <!-- Flow diagram -->
                <rect x="0" y="40" width="80" height="40" class="transistor"/>
                <text x="40" y="65" class="pin-label" text-anchor="middle">Gates</text>
                
                <line x1="80" y1="60" x2="120" y2="60" class="wire"/>
                
                <!-- NJT -->
                <circle cx="160" cy="60" r="30" class="transistor"/>
                <text x="160" y="68" class="pin-label" text-anchor="middle" font-size="16">+</text>
                <path d="M 148 52 L 172 52" class="arrow" stroke-width="2"/>
                <polygon points="172,52 168,48 168,56" class="arrow"/>
                <text x="160" y="100" class="desc" text-anchor="middle">NJT</text>
                
                <line x1="190" y1="60" x2="230" y2="60" class="wire"/>
                
                <!-- World Router -->
                <g transform="translate(230, 40)">
                    <path d="M0,0 L0,40 L40,30 L40,10 Z" class="transistor"/>
                    <text x="20" y="-10" class="desc" text-anchor="middle">MUX</text>
                </g>
                
                <line x1="270" y1="60" x2="310" y2="60" class="wire"/>
                
                <!-- D→W→P -->
                <rect x="310" y="40" width="120" height="40" class="transistor"/>
                <text x="370" y="65" class="pin-label" text-anchor="middle">D→W→P</text>
                
                <line x1="430" y1="60" x2="470" y2="60" class="wire"/>
                
                <!-- Clamp -->
                <rect x="470" y="40" width="60" height="40" class="transistor"/>
                <text x="500" y="65" class="pin-label" text-anchor="middle">Clamp</text>
                
                <text x="265" y="130" class="desc" text-anchor="middle">NJTs add active gain between passive stages</text>
                <text x="265" y="150" class="param" text-anchor="middle">Flow direction always C→E (never reversed)</text>
            </g>
        </svg>