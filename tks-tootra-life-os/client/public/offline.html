<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TKS Tootra — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0e1a;
      color: #e8e0d0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 420px;
    }
    .triangle {
      width: 80px;
      height: 70px;
      margin: 0 auto 2rem;
    }
    .triangle svg {
      width: 100%;
      height: 100%;
    }
    h1 {
      font-size: 1.5rem;
      color: #d4a843;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    p {
      font-size: 0.95rem;
      color: #8a8070;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .motto {
      font-style: italic;
      color: #6a6050;
      font-size: 0.85rem;
      border-top: 1px solid #1a1e2e;
      padding-top: 1.5rem;
    }
    button {
      background: linear-gradient(135deg, #d4a843, #c49535);
      color: #0a0e1a;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="triangle">
      <svg viewBox="0 0 80 70" fill="none">
        <polygon points="40,5 75,65 5,65" stroke="#d4a843" stroke-width="3" fill="none" />
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>TKS Tootra needs an internet connection to sync your tasks and generate AI-powered insights. Please check your connection and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
    <p class="motto">"Est Ars Celare Artem"</p>
  </div>
</body>
</html>
