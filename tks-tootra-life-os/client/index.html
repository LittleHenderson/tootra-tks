<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>TKS Tootra — Life Execution System</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#d4a843" />
    <meta name="background-color" content="#0a0e1a" />

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TKS Tootra" />
    <link rel="apple-touch-icon" href="https://d2xsxph8kpxj0f.cloudfront.net/94944829/f5haNuBW7Ar9emg5jDjqxD/tks-icon-192-5dcog9K2d6UXcais9BdKuW.png" />

    <!-- Windows Tile -->
    <meta name="msapplication-TileColor" content="#0a0e1a" />
    <meta name="msapplication-TileImage" content="https://d2xsxph8kpxj0f.cloudfront.net/94944829/f5haNuBW7Ar9emg5jDjqxD/tks-icon-192-5dcog9K2d6UXcais9BdKuW.png" />

    <!-- SEO / Open Graph -->
    <meta name="description" content="A life operating system built on the Total Knowledge System. Map every task to the deeper dimensions of your life." />
    <meta property="og:title" content="TKS Tootra — Life Execution System" />
    <meta property="og:description" content="Map every task to the deeper dimensions of your life with AI-powered TKS Foundation mapping." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://d2xsxph8kpxj0f.cloudfront.net/94944829/f5haNuBW7Ar9emg5jDjqxD/tks-icon-512-YYy3fpUv5HvsY9RWGpTYft.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://d2xsxph8kpxj0f.cloudfront.net/94944829/f5haNuBW7Ar9emg5jDjqxD/tks-icon-192-5dcog9K2d6UXcais9BdKuW.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('[PWA] Service Worker registered:', registration.scope);
              // Check for updates periodically
              setInterval(() => registration.update(), 60 * 60 * 1000);
            })
            .catch((error) => {
              console.log('[PWA] Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>

</html>
