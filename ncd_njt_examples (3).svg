
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    .title { font:700 18px ui-monospace,Consolas,monospace; }
    .label { font: 12px ui-monospace,Consolas,monospace; }
    .shape { fill:none; stroke:#000; stroke-width:2.2 }
    .thin  { stroke-width:1.6 }
    .eq    { font: 12px ui-monospace,Consolas,monospace; }
  </style>

  <text x="600" y="40" text-anchor="middle" class="title">NJT Worked Examples (Print)</text>

  <!-- Example 1: Cue→Action Amplifier (NJT+) -->
  <g transform="translate(50,80)">
    <rect x="0" y="0" width="1100" height="220" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="6,6"/>
    <text x="10" y="-10" class="label">1) NJT⁺ Amplifier — small cue unlocks strong action</text>

    <!-- Cause line -->
    <line x1="160" y1="30" x2="160" y2="-20" class="thin shape"/>
    <text x="172" y="-24" class="label">C (Cause)</text>

    <!-- Effect line -->
    <line x1="160" y1="200" x2="160" y2="240" class="thin shape"/>
    <text x="172" y="252" class="label">E (Effect)</text>

    <!-- Transistor circle -->
    <circle cx="160" cy="110" r="60" class="shape"/>
    <line x1="100" y1="110" x2="160" y2="110" class="thin shape"/> <!-- base -->
    <line x1="120" y1="80" x2="120" y2="140" class="shape"/>       <!-- internal bar -->
    <line x1="120" y1="140" x2="150" y2="170" class="thin shape"/> <!-- arrow to E -->
    <polygon points="150,170 143,156 136,163" fill="#000"/>

    <!-- Base badges box -->
    <rect x="20" y="90" width="70" height="40" class="thin shape"/>
    <text x="25" y="106" class="label">N8→N9</text>
    <text x="25" y="122" class="label">N7: 22:00</text>

    <!-- Output load and arrow -->
    <line x1="220" y1="110" x2="340" y2="110" class="thin shape"/>
    <rect x="340" y="90" width="110" height="40" class="thin shape"/>
    <text x="346" y="114" class="label">Routine Start</text>

    <!-- Equation -->
    <text x="500" y="115" class="eq">p_E = clamp( β · p_C · σ(k(p_B − τ_B)), 0, 1 )</text>
    <text x="500" y="140" class="eq">β = ×N4 · world_weight · P_gain</text>
  </g>

  <!-- Example 2: Inhibitory Brake (NJT−) -->
  <g transform="translate(50,340)">
    <rect x="0" y="0" width="1100" height="220" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="6,6"/>
    <text x="10" y="-10" class="label">2) NJT⁻ Brake — distraction signal gates flow down</text>

    <!-- Cause & Effect lines -->
    <line x1="160" y1="30" x2="160" y2="-20" class="thin shape"/>
    <text x="172" y="-24" class="label">C</text>
    <line x1="160" y1="200" x2="160" y2="240" class="thin shape"/>
    <text x="172" y="252" class="label">E</text>

    <!-- Transistor NJT- -->
    <circle cx="160" cy="110" r="60" class="shape"/>
    <line x1="100" y1="110" x2="160" y2="110" class="thin shape"/>
    <line x1="120" y1="80" x2="120" y2="140" class="shape"/>
    <line x1="150" y1="50" x2="120" y2="20" class="thin shape"/>
    <polygon points="120,20 127,34 134,27" fill="#000"/>

    <!-- Base badge -->
    <rect x="20" y="90" width="70" height="40" class="thin shape"/>
    <text x="25" y="114" class="label">−N3</text>

    <!-- Output block -->
    <line x1="220" y1="110" x2="340" y2="110" class="thin shape"/>
    <rect x="340" y1="90" y="90" width="140" height="40" class="thin shape"/>
    <text x="346" y="114" class="label">Distraction damped</text>

    <text x="520" y="115" class="eq">p_E = clamp( β · p_C · (1 − σ(k(p_B − τ_B))), 0, 1 )</text>
  </g>

  <!-- Example 3: Differential Pair (chooser) -->
  <g transform="translate(50,600)">
    <rect x="0" y="0" width="1100" height="240" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="6,6"/>
    <text x="10" y="-10" class="label">3) Differential Pair — winner-takes-most choice</text>

    <!-- Shared Cause -->
    <line x1="230" y1="10" x2="230" y2="-20" class="thin shape"/>
    <text x="242" y="-24" class="label">Shared Cause</text>

    <!-- Left NJT+ -->
    <circle cx="170" cy="120" r="50" class="shape"/>
    <line x1="120" y1="120" x2="170" y2="120" class="thin shape"/>
    <line x1="145" y1="95" x2="145" y2="145" class="shape"/>
    <line x1="145" y1="145" x2="168" y2="168" class="thin shape"/>
    <polygon points="168,168 162,155 155,162" fill="#000"/>
    <text x="96" y="124" class="label">B1</text>

    <!-- Right NJT+ -->
    <circle cx="290" cy="120" r="50" class="shape"/>
    <line x1="240" y1="120" x2="290" y2="120" class="thin shape"/>
    <line x1="265" y1="95" x2="265" y2="145" class="shape"/>
    <line x1="265" y1="145" x2="288" y2="168" class="thin shape"/>
    <polygon points="288,168 282,155 275,162" fill="#000"/>
    <text x="316" y="124" class="label">B2</text>

    <!-- Outputs -->
    <line x1="340" y1="120" x2="420" y2="120" class="thin shape"/>
    <rect x="420" y="100" width="120" height="40" class="thin shape"/>
    <text x="426" y="124" class="label">Path 2 output</text>

    <line x1="120" y1="120" x2="40" y2="120" class="thin shape"/>
    <rect x="0" y="100" width="120" height="40" class="thin shape"/>
    <text x="6" y="124" class="label">Path 1 output</text>

    <!-- Note -->
    <text x="600" y="130" class="eq">Winner ≈ argmax( β · g(Bi) ) — bias whichever base you intend to favor.</text>
  </g>
</svg>
